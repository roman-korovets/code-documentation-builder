<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Financial Reporting Matrix — Applied steps panel mockup</title>
    <style>
      /* ------------------------------------------------------------------
         Clone of the visual's "Applied steps" panel — the calculation list
         shown beside the editor in edit mode.

         Geometry is lifted from the real component so a mockup and a
         screenshot line up:

           src/components/apllied-steps/AppliedSteps.tsx  — Container, HeaderContainer,
                                                            MoveUpDownContainer, List
           src/components/apllied-steps/Styles.ts         — StepContainer, ActionButtons,
                                                            EmptyResult, SearchWrapper
           src/components/apllied-steps/styles.css        — .applied-steps-container, .step-element
           src/components/apllied-steps/components/       — Search, RenameStepModal,
                                                            EmptySearchingResult

         Two things drive the look and are easy to get wrong:

         1. The selected step is NOT a theme accent — it is a flat
            rgba(0,0,0,0.1) wash over white (StepContainer $selected).
            There is no border, no left marker, no colour change.
         2. The per-step action buttons (rename pencil, delete X) are always
            in the DOM at min-width 32px and are hidden with opacity: 0,
            not display: none. The row's text therefore does not reflow on
            hover — it is already 32px short of the right edge.
         3. Every grid/flex ancestor of a step label needs an explicit
            min-width: 0 (or a minmax(0, …) track). Grid and flex items default
            to min-width: auto, and a nowrap label has no min-content narrower
            than the whole string — so the list, the header and the search row
            silently grow past the 250px panel and .as-panel's overflow: hidden
            shears off the right edge: the second move arrow, the search
            button's right half, the list border, the delete X. The panel looks
            fine while the list is empty, which is what makes this one bite.

         The search row is an antd v5 Space.Compact: the Input and the
         icon Button are welded, so the seam between them is a single
         shared 1px border and the outer corners keep the 6px radius.
      ------------------------------------------------------------------ */

      :root {
        --as-font: 'Segoe UI', 'Segoe UI Web (West European)', Tahoma, Arial, sans-serif;
        --as-text: rgba(0, 0, 0, 0.88);
        --as-text-muted: rgba(0, 0, 0, 0.45);
        --as-border: #d9d9d9;
        --as-selected: rgba(0, 0, 0, 0.1);

        /* panel geometry — single source of truth */
        --as-width: 250px;
        --as-pad: 5px;
        --as-header-h: 24px;
        --as-step-line: 22px;
        --as-actions-w: 32px;
        --as-input-h: 32px;
      }

      body {
        margin: 0;
        padding: 32px;
        background: #faf9f8;
        font-family: var(--as-font);
        color: var(--as-text);
        display: flex;
        flex-wrap: wrap;
        gap: 32px;
        align-items: flex-start;
      }

      figure {
        margin: 0;
      }

      figcaption {
        font-size: 12px;
        color: #605e5c;
        margin-bottom: 8px;
      }

      /* --- Container (AppliedSteps.tsx) ------------------------------- */
      .as-panel {
        box-sizing: border-box;
        padding: var(--as-pad);
        background: #fff;
        width: var(--as-width);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12), 0 2px 2px rgba(0, 0, 0, 0.24);
        overflow: hidden;
      }

      /* --- .applied-steps-container (styles.css) ---------------------- */
      .as-body {
        display: grid;
        /* minmax(0, 1fr), not the implicit auto column: an auto track is sized
           by its content's min-content width, and the nowrap step labels have
           no min-content smaller than the whole string — so the track (and with
           it the header and the list) grows past the 250px panel and gets
           sliced off by .as-panel's overflow: hidden. See note 3 above. */
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto 1fr;
        font-size: 13px;
      }

      /* --- HeaderContainer / Header / MoveUpDownContainer ------------- */
      .as-header {
        display: flex;
        min-height: var(--as-header-h);
      }

      .as-header-title {
        margin: 0 5px;
      }

      .as-move {
        margin: 0 5px 0 auto;
        width: var(--as-actions-w);
        display: flex;
      }

      .as-move svg:last-child {
        margin-left: 10px;
      }

      /* --- SearchWrapper + antd Space.Compact ------------------------- */
      .as-search {
        margin: var(--as-pad);
        display: flex;
      }

      .as-input {
        box-sizing: border-box;
        flex: 1;
        min-width: 0;
        height: var(--as-input-h);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 4px 11px;
        border: 1px solid var(--as-border);
        border-radius: 6px 0 0 6px;
        background: #fff;
        font-size: 14px;
        color: var(--as-text-muted);
      }

      .as-input.has-value {
        color: var(--as-text);
      }

      .as-search-btn {
        box-sizing: border-box;
        width: var(--as-input-h);
        height: var(--as-input-h);
        margin-left: -1px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--as-border);
        border-radius: 0 6px 6px 0;
        background: #fff;
        color: var(--as-text);
      }

      /* --- List (AppliedSteps.tsx) ------------------------------------ */
      .as-list {
        box-sizing: border-box;
        margin: var(--as-pad);
        padding: 0;
        border: 1px solid var(--as-border);
        min-height: 100px;
        overflow: auto;
      }

      /* --- .step-element + StepContainer ----------------------------- */
      .as-step {
        line-height: var(--as-step-line);
      }

      .as-step > div {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0);
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow: hidden;
      }

      .as-step.is-selected > div {
        background: var(--as-selected);
      }

      .as-step-label {
        /* min-width: 0 is what makes the ellipsis real. As a flex item this
           span defaults to min-width: auto, whose min-content size is the
           entire unbroken label — it would refuse to shrink and push the row
           wide instead of truncating. Same reason .as-input carries it. */
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
      }

      /* --- ActionButtons: present but transparent until hover -------- */
      .as-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-width: var(--as-actions-w);
        flex: 0 0 var(--as-actions-w);
        opacity: 0;
      }

      .as-step:hover .as-actions,
      .as-step.is-hovered .as-actions {
        opacity: 1;
      }

      .as-actions svg {
        cursor: pointer;
      }

      /* --- EmptyResult (Styles.ts) ----------------------------------- */
      .as-empty {
        text-align: center;
        padding-top: 40px;
        padding-bottom: 24px;
        color: var(--as-text);
      }

      .as-empty .as-emoji {
        font-size: 20px;
        padding-bottom: 8px;
        display: block;
      }

      .as-empty p {
        margin: 0;
      }

      /* antd outlined icons, drawn at the 1em they inherit */
      .as-icon {
        width: 1em;
        height: 1em;
        fill: currentColor;
        display: inline-block;
        vertical-align: -0.125em;
      }
    </style>
  </head>
